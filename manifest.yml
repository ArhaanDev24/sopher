modules:
  jira:globalPage:
    - key: sopher-dashboard
      title: Capitalization
      resource: dashboard
      resolver:
        function: resolver
      render: native
  jira:issuePanel:
    - key: sopher-issue-panel
      title: Capitalization
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      resource: issue-panel
      resolver:
        function: resolver
      render: native
  jira:adminPage:
    - key: sopher-admin
      title: Sopher settings
      resource: admin
      resolver:
        function: resolver
      render: native
  rovo:agent:
    - key: cap-analyst
      name: Cap Analyst
      description: Explains how engineering work in Jira is capitalized or expensed
        under ASC 350-40 / IAS 38.
      prompt: resource:agent-prompt;prompt.txt
      conversationStarters:
        - What did we capitalize this quarter?
        - Why is this issue capitalized?
        - What needs controller review?
      actions:
        - get-schedule
        - explain-classification
        - list-review-queue
  action:
    - key: get-schedule
      name: Get capitalization schedule
      function: fn-get-schedule
      actionVerb: GET
      description: Returns the capitalization schedule for a Jira project and quarter.
        It includes capitalized and expensed cost, amortization and net book
        value per epic (software asset).
      inputs:
        projectKey:
          title: Project key
          type: string
          required: true
          description: Jira project key, for example PAY
        quarter:
          title: Quarter
          type: string
          required: false
          description: Quarter in YYYY-QN format, for example 2026-Q3. Defaults to the
            current quarter.
    - key: explain-classification
      name: Explain classification
      function: fn-explain
      actionVerb: GET
      description: Explains whether a Jira issue's work is capitalized or expensed,
        with its project stage, cost breakdown, confidence and reasons.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: Jira issue key, for example PAY-42
    - key: list-review-queue
      name: List review queue
      function: fn-review-queue
      actionVerb: GET
      description: Lists the issues in a project and quarter whose classification
        needs controller review, with the reason for each.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: true
          description: Jira project key, for example PAY
        quarter:
          title: Quarter
          type: string
          required: false
          description: Quarter in YYYY-QN format, for example 2026-Q3. Defaults to the
            current quarter.
  rovo:mcp:
    - key: sopher-mcp
      name: Sopher Capitalization
      tools:
        - get-schedule
        - explain-classification
        - list-review-queue
  function:
    - key: resolver
      handler: index.handler
    - key: fn-get-schedule
      handler: index.getScheduleAction
    - key: fn-explain
      handler: index.explainClassificationAction
    - key: fn-review-queue
      handler: index.listReviewQueueAction
resources:
  - key: dashboard
    path: src/frontend/dashboard.jsx
  - key: issue-panel
    path: src/frontend/issue-panel.jsx
  - key: admin
    path: src/frontend/admin.jsx
  - key: agent-prompt
    path: src/agent
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - manage:jira-project
    - read:jira-user
    - storage:app
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/531f3777-ac41-4ef3-8c9c-5ba9aa764708
